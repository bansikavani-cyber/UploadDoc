# kt: Azure DevOps Pipeline for Multi-Environment Bicep Deployment
# kt: This pipeline builds and deploys to dev and qa automatically, and to prod with manual approval (pre-deployment gate)
# kt: Each environment uses its own Bicep file and resource group
# kt: Set your Azure service connection and variable groups for secrets

trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  # kt: Set these in Azure DevOps variable groups or pipeline variables
  azureServiceConnection: 'UploadDocService'
  location: 'australiaeast'
  devResourceGroup: 'dev-rg-ae'
  qaResourceGroup: 'qa-rg-ae'
  prodResourceGroup: 'prod-rg-ae'
  devSqlPassword: $(DEV_SQL_PASSWORD)
  qaSqlPassword: $(QA_SQL_PASSWORD)
  prodSqlPassword: $(PROD_SQL_PASSWORD)

stages:
# kt: Validate_Bicep stage runs Bicep build, lint, and what-if for all environments before any deployment.
- stage: Validate_Bicep
  displayName: 'Validate and Test Bicep Files'
  jobs:
  - job: ValidateBicep
    displayName: 'Bicep Syntax, Lint, and What-If'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - bash: |
        echo "##[section]Debug: infra/dev.bicep (first 200 lines)"
        sed -n '1,200p' infra/dev.bicep
        echo "##[section]Debug: grep for Compute resources (should be empty)"
        grep -R "Microsoft\.Compute" infra/ || true
        echo "##[section]Debug: grep for networkInterfaces/virtualNetworks/publicIPAddresses (should be empty)"
        grep -R "Microsoft\.Network/(networkInterfaces|virtualNetworks|publicIPAddresses)" infra/ || true
      displayName: 'Debug: show Bicep & confirm no VM resources'
    - task: AzureCLI@2
      displayName: 'Bicep Build, Lint, and What-If'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail

          az bicep install

          echo "creation: starting (resource groups)"
          echo "##[group]Resource groups"
          az group create --name $(devResourceGroup) --location $(location) --only-show-errors
          az group create --name $(qaResourceGroup) --location $(location) --only-show-errors
          az group create --name $(prodResourceGroup) --location $(location) --only-show-errors
          echo "##[endgroup]"
          echo "creation: completed (resource groups)"

          echo "creation: starting (bicep build & lint)"
          echo "##[group]Bicep build & lint"
          az bicep build --file infra/dev.bicep
          az bicep build --file infra/qa.bicep
          az bicep build --file infra/prod.bicep
          az bicep lint --file infra/dev.bicep
          az bicep lint --file infra/qa.bicep
          az bicep lint --file infra/prod.bicep
          echo "##[endgroup]"
          echo "creation: completed (bicep build & lint)"

          echo "##[group]What-if Dev (App Service + SQL)"
          az deployment group what-if \
            --resource-group $(devResourceGroup) \
            --template-file infra/dev.bicep \
            --parameters sqlPassword="$DEV_SQL_PASSWORD" \
            --no-pretty-print
          echo "##[endgroup]"
          echo "creation: completed (what-if dev)"

          echo "##[group]What-if QA (App Service + SQL)"
          az deployment group what-if \
            --resource-group $(qaResourceGroup) \
            --template-file infra/qa.bicep \
            --parameters sqlPassword="$QA_SQL_PASSWORD" \
            --no-pretty-print
          echo "##[endgroup]"
          echo "creation: completed (what-if qa)"

          echo "##[group]What-if Prod (App Service + SQL)"
          az deployment group what-if \
            --resource-group $(prodResourceGroup) \
            --template-file infra/prod.bicep \
            --parameters sqlPassword="$PROD_SQL_PASSWORD" \
            --no-pretty-print
          echo "##[endgroup]"
          echo "creation: completed (what-if prod)"
      env:
        DEV_SQL_PASSWORD: $(DEV_SQL_PASSWORD)
        QA_SQL_PASSWORD: $(QA_SQL_PASSWORD)
        PROD_SQL_PASSWORD: $(PROD_SQL_PASSWORD)

- stage: Build
  displayName: 'Build App'
  jobs:
  - job: Build
    steps:
    - checkout: self
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.0.x'
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - bash: |
        set -euo pipefail
        if [ -f app/frontend/package.json ]; then
          cd app/frontend
          npm ci
        else
          echo "Skipping frontend dependency install: app/frontend/package.json not found."
        fi
      displayName: 'Install frontend dependencies'
    - bash: |
        set -euo pipefail
        if [ -f app/frontend/package.json ]; then
          cd app/frontend
          npm run build
        else
          echo "Skipping frontend build: app/frontend/package.json not found."
        fi
      displayName: 'Build frontend'
    - bash: |
        set -euo pipefail
        if find app/backend -maxdepth 1 \( -name '*.csproj' -o -name '*.sln' \) | grep -q .; then
          dotnet build app/backend --configuration Release
        else
          echo "Skipping backend build: no .csproj or .sln file found in app/backend."
        fi
      displayName: 'Build backend'

- stage: Deploy_Dev
  displayName: 'Deploy to Dev'
  dependsOn: [Build, Validate_Bicep]
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Deploy Dev (App Service + SQL)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[section]Deploy Dev (App Service + SQL)"
                echo "App Service - In Progress"
                echo "SQL - In Progress"
                echo "##[group]Deployment"
                az deployment group create \
                  --resource-group $(devResourceGroup) \
                  --template-file infra/dev.bicep \
                  --parameters sqlPassword="$DEV_SQL_PASSWORD"
                echo "##[endgroup]"
                echo "SQL - Completed"
                echo "App Service - Completed"
                echo "##[section]Deploy Dev Completed"
            env:
              DEV_SQL_PASSWORD: $(DEV_SQL_PASSWORD)
          # kt: Add steps to deploy backend/frontend as needed

- stage: Deploy_QA
  displayName: 'Deploy to QA'
  dependsOn: [Build, Validate_Bicep]
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Deploy QA (App Service + SQL)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[section]Deploy QA (App Service + SQL)"
                echo "App Service - In Progress"
                echo "SQL - In Progress"
                echo "##[group]Deployment"
                az deployment group create \
                  --resource-group $(qaResourceGroup) \
                  --template-file infra/qa.bicep \
                  --parameters sqlPassword="$QA_SQL_PASSWORD"
                echo "##[endgroup]"
                echo "SQL - Completed"
                echo "App Service - Completed"
                echo "##[section]Deploy QA Completed"
            env:
              QA_SQL_PASSWORD: $(QA_SQL_PASSWORD)
          # kt: Add steps to deploy backend/frontend as needed

- stage: Deploy_Prod
  displayName: 'Deploy to Prod'
  dependsOn: [Build, Validate_Bicep]
  jobs:
  - deployment: DeployProd
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Deploy Prod (App Service + SQL)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[section]Deploy Prod (App Service + SQL)"
                echo "App Service - In Progress"
                echo "SQL - In Progress"
                echo "##[group]Deployment"
                az deployment group create \
                  --resource-group $(prodResourceGroup) \
                  --template-file infra/prod.bicep \
                  --parameters sqlPassword="$PROD_SQL_PASSWORD"
                echo "##[endgroup]"
                echo "SQL - Completed"
                echo "App Service - Completed"
                echo "##[section]Deploy Prod Completed"
            env:
              PROD_SQL_PASSWORD: $(PROD_SQL_PASSWORD)
          # kt: Add steps to deploy backend/frontend as needed
        # kt: To require manual approval before prod deployment, set up an 'Approval and checks' gate for the 'prod' environment in Azure DevOps UI. You can set a timeout there as well.
