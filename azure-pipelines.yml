# kt: Azure DevOps Pipeline for Multi-Environment Bicep Deployment
# kt: This pipeline builds and deploys to dev and qa automatically, and to prod with manual approval (pre-deployment gate)
# kt: Each environment uses its own Bicep file and resource group
# kt: Set your Azure service connection and variable groups for secrets

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # kt: Set these in Azure DevOps variable groups or pipeline variables
  devResourceGroup: 'dev-rg'
  qaResourceGroup: 'qa-rg'
  prodResourceGroup: 'prod-rg'
  devSqlPassword: '$(DEV_SQL_PASSWORD)'
  qaSqlPassword: '$(QA_SQL_PASSWORD)'
  prodSqlPassword: '$(PROD_SQL_PASSWORD)'

stages:
# kt: Validate_Bicep stage runs Bicep build, lint, and what-if for all environments before any deployment.
- stage: Validate_Bicep
  displayName: 'Validate and Test Bicep Files'
  jobs:
  - job: ValidateBicep
    displayName: 'Bicep Syntax, Lint, and What-If'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    # kt: Build (syntax check) all Bicep files
    - script: |
        az bicep build --file infra/dev.bicep
        az bicep build --file infra/qa.bicep
        az bicep build --file infra/prod.bicep
      displayName: 'Bicep Build (Syntax Check)'
    # kt: Lint all Bicep files for best practices
    - script: |
        az bicep lint --file infra/dev.bicep
        az bicep lint --file infra/qa.bicep
        az bicep lint --file infra/prod.bicep
      displayName: 'Bicep Lint (Best Practices)'
    # kt: What-If deployment for Dev
    - script: |
        az deployment group what-if \
          --resource-group $(devResourceGroup) \
          --template-file infra/dev.bicep \
          --parameters sqlPassword=$(devSqlPassword)
      displayName: 'Bicep What-If (Dev)'
    # kt: What-If deployment for QA
    - script: |
        az deployment group what-if \
          --resource-group $(qaResourceGroup) \
          --template-file infra/qa.bicep \
          --parameters sqlPassword=$(qaSqlPassword)
      displayName: 'Bicep What-If (QA)'
    # kt: What-If deployment for Prod
    - script: |
        az deployment group what-if \
          --resource-group $(prodResourceGroup) \
          --template-file infra/prod.bicep \
          --parameters sqlPassword=$(prodSqlPassword)
      displayName: 'Bicep What-If (Prod)'

- stage: Build
  displayName: 'Build App'
  jobs:
  - job: Build
    steps:
    - checkout: self
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.0.x'
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        cd app/frontend
        npm install
      displayName: 'Install frontend dependencies'
    - script: |
        cd app/frontend
        npm run build
      displayName: 'Build frontend'
    - script: |
        cd app/backend
        dotnet build --configuration Release
      displayName: 'Build backend'

- stage: Deploy_Dev
  displayName: 'Deploy to Dev'
  dependsOn: [Build, Validate_Bicep]
  jobs:
  - deployment: DeployDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Deploy Bicep (Dev)'
            inputs:
              azureSubscription: 'YourAzureServiceConnection' # kt: Set your Azure service connection name
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --resource-group $(devResourceGroup) \
                  --template-file infra/dev.bicep \
                  --parameters sqlPassword=$(devSqlPassword)
          # kt: Add steps to deploy backend/frontend as needed

- stage: Deploy_QA
  displayName: 'Deploy to QA'
  dependsOn: [Build, Validate_Bicep]
  jobs:
  - deployment: DeployQA
    environment: 'qa'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Deploy Bicep (QA)'
            inputs:
              azureSubscription: 'YourAzureServiceConnection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --resource-group $(qaResourceGroup) \
                  --template-file infra/qa.bicep \
                  --parameters sqlPassword=$(qaSqlPassword)
          # kt: Add steps to deploy backend/frontend as needed

- stage: Deploy_Prod
  displayName: 'Deploy to Prod'
  dependsOn: [Build, Validate_Bicep]
  jobs:
  - deployment: DeployProd
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: 'Deploy Bicep (Prod)'
            inputs:
              azureSubscription: 'YourAzureServiceConnection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --resource-group $(prodResourceGroup) \
                  --template-file infra/prod.bicep \
                  --parameters sqlPassword=$(prodSqlPassword)
          # kt: Add steps to deploy backend/frontend as needed
        # kt: To require manual approval before prod deployment, set up an 'Approval and checks' gate for the 'prod' environment in Azure DevOps UI. You can set a timeout there as well.
